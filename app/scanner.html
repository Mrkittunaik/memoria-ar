            // ================================================================
            function refreshStatusPill() {
                const pill = document.getElementById('statusPill');
                const text = document.getElementById('statusText');
                const activeCount = [...arTargets.values()].filter(e => e.visible).length;
                clearTimeout(window._pillTimer);
                if (activeCount > 0) {
                    pill.classList.remove('fade-out');
                    pill.className = 'status-pill found';
                    text.textContent = activeCount === 1 ? 'Memory found' : activeCount + ' memories found';
                    window._pillTimer = setTimeout(() => pill.classList.add('fade-out'), 1800);
                } else {
                    pill.classList.remove('fade-out');
                    pill.className = 'status-pill ready';
                    text.textContent = '🔍 Scanning for photos…';
                }
            }

            // ================================================================
            // LOG SCAN
            // ================================================================
            async function logScan(memoryId) {
                try {
                    await fetch(`${BACKEND_URL}/api/scan/log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            memoryId,
                            sessionId: getSessionId(),
                            deviceType: /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
                            userAgent: navigator.userAgent
                        })
                    });
                } catch (e) { /* ignore */ }
            }

            // ================================================================
            // TRIGGER OPEN WITH CONFIRM
            // ================================================================
            function triggerOpenWithConfirm(targetId) {
                const entry = arTargets.get(targetId);
                if (!entry) { openFullscreen(targetId); return; }

                entry.corners.classList.remove('confirm-pulse');
                void entry.corners.offsetWidth;
                entry.corners.classList.add('confirm-pulse');
                setTimeout(() => entry.corners.classList.remove('confirm-pulse'), 200);

                if (navigator.vibrate) { try { navigator.vibrate(15); } catch (_) {} }
                setTimeout(() => openFullscreen(targetId), 90);
            }

            // ================================================================
            // FULLSCREEN PLAYER
            // ================================================================
            function openFullscreen(targetId) {
                const entry = arTargets.get(targetId);
                if (!entry) return;
                stopScanLoop();
                fsOpenTargetId = targetId;
                const fsPlayer = document.getElementById('fullscreen-player');

                const srcRect = entry.video.getBoundingClientRect();
                const vw = window.innerWidth,
                    vh = window.innerHeight;
                if (srcRect.width > 0 && srcRect.height > 0) {
                    const originX = ((srcRect.left + srcRect.width / 2) / vw) * 100;
                    const originY = ((srcRect.top + srcRect.height / 2) / vh) * 100;
                    const scaleX = srcRect.width / vw;
                    const scaleY = srcRect.height / vh;
                    const startScale = Math.max(0.08, Math.min(scaleX, scaleY, 1));
                    fsPlayer.style.setProperty('--fs-origin-x', originX + '%');
                    fsPlayer.style.setProperty('--fs-origin-y', originY + '%');
                    fsPlayer.style.setProperty('--fs-origin-scale', String(startScale));
                } else {
                    fsPlayer.style.setProperty('--fs-origin-x', '50%');
                    fsPlayer.style.setProperty('--fs-origin-y', '50%');
                    fsPlayer.style.setProperty('--fs-origin-scale', '0.3');
                }

                fsVideo.src = entry.video.currentSrc || entry.video.src || '';
                fsVideo.muted = false;
                fsVideo.currentTime = entry.video.currentTime || 0;
                entry.video.pause();

                fsPlayer.classList.remove('closing');
                requestAnimationFrame(() => {
                    fsPlayer.classList.add('open');
                });

                fsVideo.play().catch(() => { fsVideo.muted = true;
                    fsVideo.play().catch(() => {}); });
                updateFsMuteIcon();
                showFsControls(true);
            }

            function closeFullscreen(e) {
                if (e) e.stopPropagation();
                const fsPlayer = document.getElementById('fullscreen-player');
                document.getElementById('fsMenu').classList.remove('open');
                fsVideo.pause();
                const entry = fsOpenTargetId && arTargets.get(fsOpenTargetId);
                if (entry) entry.video.play().catch(() => {});
                fsOpenTargetId = null;
                startScanLoop();

                fsPlayer.classList.remove('open');
                fsPlayer.classList.add('closing');
                const onCloseTransitionEnd = (ev) => {
                    if (ev.target !== fsPlayer) return;
                    fsPlayer.classList.remove('closing');
                    fsPlayer.removeEventListener('transitionend', onCloseTransitionEnd);
                };
                fsPlayer.addEventListener('transitionend', onCloseTransitionEnd);
                setTimeout(() => {
                    fsPlayer.classList.remove('closing');
                    fsPlayer.removeEventListener('transitionend', onCloseTransitionEnd);
                }, 500);
            }

            function onFsTap(e) {
                const controls = document.getElementById('fs-controls');
                if (controls.classList.contains('hidden')) {
                    showFsControls(true);
                } else {
                    showFsControls(false);
                }
            }

            function showFsControls(visible) {
                const controls = document.getElementById('fs-controls');
                clearTimeout(fsControlsTimer);
                if (visible) {
                    controls.classList.remove('hidden');
                    if (!fsVideo.paused) {
                        fsControlsTimer = setTimeout(() => controls.classList.add('hidden'), 3200);
                    }
                } else {
                    controls.classList.add('hidden');
                    document.getElementById('fsMenu').classList.remove('open');
                }
            }

            function toggleFsPlay(e) {
                if (e) e.stopPropagation();
                if (fsVideo.paused) fsVideo.play();
                else fsVideo.pause();
            }

            function toggleFsMute(e) {
                if (e) e.stopPropagation();
                fsVideo.muted = !fsVideo.muted;
                updateFsMuteIcon();
            }

            function updateFsMuteIcon() {
                const btn = document.getElementById('fsMuteBtn');
                btn.innerHTML = fsVideo.muted ?
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>' :
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>';
            }

            function toggleFsMenu(e) {
                e.stopPropagation();
                document.getElementById('fsMenu').classList.toggle('open');
            }

            async function downloadCurrentVideo(e) {
                e.stopPropagation();
                document.getElementById('fsMenu').classList.remove('open');
                const url = fsVideo.currentSrc || fsVideo.src;
                if (!url) return;
                try {
                    const res = await fetch(url);
                    const blob = await res.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'memoria-video.mp4';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    showFsToast('Downloading video…');
                } catch (err) {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'memoria-video.mp4';
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    showFsToast('Downloading video…');
                }
            }

            function showFsToast(msg) {
                const toast = document.getElementById('fs-toast');
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(window._toastTimer);
                window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            // ---- FS video event listeners ----
            fsVideo.addEventListener('play', () => {
                document.getElementById('fsCenterIcon').innerHTML =
                    '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
                document.querySelector('#fsPlayBtn svg').innerHTML =
                    '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
                showFsControls(true);
            });
            fsVideo.addEventListener('pause', () => {
                document.getElementById('fsCenterIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
                document.querySelector('#fsPlayBtn svg').innerHTML = '<path d="M8 5v14l11-7z"/>';
                showFsControls(true);
                clearTimeout(fsControlsTimer);
            });
            fsVideo.addEventListener('loadedmetadata', () => {
                document.getElementById('fsTimeDuration').textContent = fmtTime(fsVideo.duration);
            });
            fsVideo.addEventListener('timeupdate', () => {
                if (fsScrubbing) return;
                const pct = fsVideo.duration ? (fsVideo.currentTime / fsVideo.duration) * 100 : 0;
                document.getElementById('fsScrubFill').style.width = pct + '%';
                document.getElementById('fsScrubHandle').style.left = pct + '%';
                document.getElementById('fsTimeCurrent').textContent = fmtTime(fsVideo.currentTime);
            });
            fsVideo.addEventListener('progress', () => {
                if (fsVideo.buffered.length && fsVideo.duration) {
                    const end = fsVideo.buffered.end(fsVideo.buffered.length - 1);
                    document.getElementById('fsScrubBuffer').style.width = ((end / fsVideo.duration) * 100) + '%';
                }
            });
            fsVideo.addEventListener('ended', () => {
                document.getElementById('fsCenterIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
                document.querySelector('#fsPlayBtn svg').innerHTML = '<path d="M8 5v14l11-7z"/>';
                showFsControls(true);
            });

            // ---- Scrubber ----
            const scrubTrack = document.getElementById('fsScrubTrack');

            function scrubToClientX(clientX) {
                const rect = scrubTrack.getBoundingClientRect();
                let pct = (clientX - rect.left) / rect.width;
                pct = Math.max(0, Math.min(1, pct));
                if (fsVideo.duration) fsVideo.currentTime = pct * fsVideo.duration;
                document.getElementById('fsScrubFill').style.width = (pct * 100) + '%';
                document.getElementById('fsScrubHandle').style.left = (pct * 100) + '%';
                document.getElementById('fsTimeCurrent').textContent = fmtTime(pct * (fsVideo.duration || 0));
            }

            function scrubStart(e) {
                e.stopPropagation();
                fsScrubbing = true;
                clearTimeout(fsControlsTimer);
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                scrubToClientX(x);
            }

            function scrubMove(e) {
                if (!fsScrubbing) return;
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                scrubToClientX(x);
            }

            function scrubEnd() {
                if (!fsScrubbing) return;
                fsScrubbing = false;
                showFsControls(true);
            }
            scrubTrack.addEventListener('mousedown', scrubStart);
            scrubTrack.addEventListener('touchstart', scrubStart, { passive: true });
            window.addEventListener('mousemove', scrubMove);
            window.addEventListener('touchmove', scrubMove, { passive: true });
            window.addEventListener('mouseup', scrubEnd);
            window.addEventListener('touchend', scrubEnd);

            document.addEventListener('click', (e) => {
                const menu = document.getElementById('fsMenu');
                if (menu.classList.contains('open') && !menu.contains(e.target)) {
                    menu.classList.remove('open');
                }
            });

            // ================================================================
            // CAMERA CONTROLS
            // ================================================================
            async function toggleTorch() {
                if (!videoTrack) return;
                if (!videoTrack.getCapabilities || !videoTrack.getCapabilities().torch) return;
                torchOn = !torchOn;
                await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
                document.getElementById('torchBtn').style.color = torchOn ? 'var(--gold)' : '#fff';
            }

            async function switchCamera() {
                if (!mindarThree) return;
                mindarThree.switchCamera();
                setTimeout(() => {
                    try { videoTrack = mindarThree.video.srcObject.getVideoTracks()[0]; } catch (_) {}
                }, 500);
            }

            function stopScanLoop() {
                if (mindarThree && mindarThree.controller) mindarThree.controller.stopProcessVideo();
            }

            function startScanLoop() {
                if (mindarThree && mindarThree.controller && mindarThree.video) {
                    mindarThree.controller.processVideo(mindarThree.video);
                }
            }

            // ================================================================
            // DEBUG HUD
            // ================================================================
            function updateDebugHud(fps, frameMs, sensorFusionActive) {
                const hud = document.getElementById('debug-hud');
                if (!hud) return;
                const fpsClass = fps >= 24 ? 'hud-good' : fps >= 14 ? 'hud-warn' : 'hud-bad';
                let html =
                    `<div class="hud-section"><div class="hud-row"><span class="hud-label">FPS</span><span class="${fpsClass}">${fps}</span></div>`;
                html +=
                    `<div class="hud-row"><span class="hud-label">Frame</span><span>${frameMs.toFixed(1)}ms</span></div>`;
                html +=
                    `<div class="hud-row"><span class="hud-label">Sensor</span><span class="${sensorFusionActive ? 'hud-good' : 'hud-warn'}">${sensorFusionActive ? 'gyro' : 'no gyro'}</span></div>`;
                html += `<div class="hud-row"><span class="hud-label">Targets</span><span>${arTargets.size}</span></div></div>`;

                arTargets.forEach((entry, id) => {
                    const tracking = entry.anchor.visible;
                    const holding = !tracking && entry._lostSince != null;
                    const state = tracking ? 'TRACK' : holding ? 'HOLD' : 'LOST';
                    const stateClass = tracking ? 'hud-good' : holding ? 'hud-warn' : 'hud-bad';
                    const confidence = entry.confidence !== undefined ? entry.confidence : 0;
                    const stability = entry.stability !== undefined ? entry.stability : 0;
                    const locked = entry.isAnchorLocked ? '🔒' : '🔓';
                    html += `<div class="hud-target">`;
                    html +=
                        `<div class="hud-row"><span class="hud-label">#${id} ${locked}</span><span class="${stateClass}">${state}</span></div>`;
                    html +=
                        `<div class="hud-row"><span class="hud-label">Conf</span><span class="${scoreClass(confidence)}">${(confidence*100).toFixed(0)}%</span></div>`;
                    html +=
                        `<div class="hud-row"><span class="hud-label">Stab</span><span class="${scoreClass(stability)}">${(stability*100).toFixed(0)}%</span></div>`;
                    html +=
                        `<div class="hud-row"><span class="hud-label">Vel</span><span>${(entry.userVel||0).toFixed(2)}</span></div>`;
                    html +=
                        `<div class="hud-row"><span class="hud-label">Reject</span><span>${entry._rejectCount||0}</span></div>`;
                    html += `</div>`;
                });
                hud.innerHTML = html;
            }

            function onLogoTap() {
                _logoTapCount++;
                clearTimeout(_logoTapTimer);
                _logoTapTimer = setTimeout(() => { _logoTapCount = 0; }, 800);
                if (_logoTapCount >= 5) {
                    _logoTapCount = 0;
                    window.__memoriaDebug = !window.__memoriaDebug;
                    document.getElementById('debug-hud').classList.toggle('on', window.__memoriaDebug);
                }
            }

            // ================================================================
            // CAMERA ERROR SCREEN
            // ================================================================
            function showCameraErrorScreen(err) {
                localStorage.removeItem(PERM_KEY);
                const name = err && err.name;
                const isBlocked = name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError';
                const isNoCamera = name === 'NotFoundError' || name === 'DevicesNotFoundError';
                const isInUse = name === 'NotReadableError' || name === 'TrackStartError';

                let title, body;
                if (isBlocked) {
                    title = 'Camera access is blocked';
                    body =
                        `You previously blocked camera access for this site. Browsers don't let websites re-ask once blocked — you'll need to allow it manually:<br><br><b>On phone (Chrome/Safari):</b> tap the icon left of the address bar (🔒 or ⓘ) → Permissions / Site settings → set Camera to Allow.<br><b>On desktop Chrome:</b> click the 🔒 / ⓘ icon in the address bar → Site settings → Camera → Allow.<br><b>On desktop Safari:</b> Safari menu → Settings → Websites → Camera → set this site to Allow.`;
                } else if (isNoCamera) {
                    title = 'No camera found';
                    body =
                        `This device doesn't have a usable camera, or it's disabled at the OS level. Check your device's camera settings and try again.`;
                } else if (isInUse) {
                    title = 'Camera is busy';
                    body = `Another app or browser tab seems to be using the camera right now. Close it and try again.`;
                } else {
                    title = 'Camera access needed';
                    body = `Something went wrong starting the camera. Please allow camera access for this site and try again.`;
                }

                document.getElementById('loading').innerHTML = `
                    <div style="text-align:center;padding:40px;max-width:360px">
                        <div style="font-size:32px;margin-bottom:16px">📷</div>
                        <h3 style="color:#fff;margin-bottom:8px">${title}</h3>
                        <p style="color:rgba(255,255,255,.55);font-size:13px;line-height:1.7">${body}</p>
                        <p style="color:rgba(255,80,80,.65);font-size:11px;margin-top:10px;word-break:break-word">
                            ${name ? '(' + name + ')' : ''}</p>
                        <button id="cameraRetryBtn"
                            style="margin-top:22px;padding:12px 28px;border-radius:10px;background:var(--gold);color:#fff;border:none;cursor:pointer;font-size:14px">
                            Try again</button>
                    </div>`;
                document.getElementById('cameraRetryBtn').addEventListener('click', retryStartScanner);
            }

            async function retryStartScanner() {
                document.getElementById('loading').innerHTML = `
                    <div style="font-family:Georgia,serif;font-size:24px;color:#fff;letter-spacing:-0.02em">Memo<span style="color:var(--gold)">ria</span></div>
                    <div class="loading-spinner"></div>
                    <div id="loading-text">
                        <h3 id="loading-title">Starting camera</h3>
                        <p id="loading-sub" style="text-align:center;margin-top:4px">Point at a registered photo to begin</p>
                        <p id="loading-counter" style="text-align:center"></p>
                    </div>`;
                await startScanner();
            }

            // ================================================================
            // START SCANNER — permission + preview + MindAR
            // ================================================================
            async function startScanner() {
                document.getElementById('demo-overlay').classList.add('hidden');
                setLoadingState('Starting camera', 'Point at a registered photo to begin', '');
                document.getElementById('loading').classList.remove('hidden');

                // Gyro permission (iOS)
                if (typeof DeviceOrientationEvent !== 'undefined' &&
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try { await DeviceOrientationEvent.requestPermission(); } catch (_) {}
                }

                // ---- Instant preview ----
                let previewStream;
                try {
                    previewStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' },
                        audio: false
                    });
                } catch (err) {
                    showCameraErrorScreen(err);
                    return;
                }
                const previewVideo = document.getElementById('instant-preview');
                previewVideo.srcObject = previewStream;

                function sizePreview() {
                    previewVideo.style.width = window.innerWidth + 'px';
                    previewVideo.style.height = window.innerHeight + 'px';
                }
                sizePreview();
                previewVideo.addEventListener('loadedmetadata', sizePreview);
                window.addEventListener('resize', sizePreview);
                window.addEventListener('orientationchange', sizePreview);

                document.getElementById('loading').classList.add('hidden');
                localStorage.setItem(PERM_KEY, 'true');

                // ---- Wake backend & fetch targets ----
                let mindUrl;
                try {
                    // First, wake the backend (handles cold start)
                    await wakeBackend();
                    // Then fetch and compile targets
                    mindUrl = await fetchAndCompileTargets();
                } catch (err) {
                    console.error('[Memoria] backend/target error:', err);
                    const statusText = document.getElementById('statusText');
                    const pill = document.getElementById('statusPill');
                    if (statusText) {
                        statusText.textContent = '❌ ' + (err.message || 'Could not connect to server. Please check your internet and try again.');
                        pill.className = 'status-pill ready';
                    }
                    // Show a retry button in the status area
                    const retryBtn = document.createElement('button');
                    retryBtn.textContent = '🔄 Retry';
                    retryBtn.style.cssText =
                        'margin-top:8px;padding:8px 20px;border-radius:8px;background:var(--gold);color:#fff;border:none;cursor:pointer;font-size:13px;font-family:inherit;';
                    retryBtn.onclick = () => {
                        retryBtn.remove();
                        startScanner();
                    };
                    const statusArea = document.querySelector('.status-area');
                    if (statusArea) statusArea.appendChild(retryBtn);
                    return;
                }
                if (!mindUrl) {
                    // No targets uploaded — show a message but keep camera running
                    const statusText = document.getElementById('statusText');
                    if (statusText) statusText.textContent = '📭 No memories uploaded yet. Add one in the dashboard.';
                    return;
                }

                // ---- Stop preview, start MindAR ----
                previewStream.getTracks().forEach(t => t.stop());
                previewVideo.srcObject = null;
                previewVideo.style.display = 'none';

                try {
                    await beginMindAR(mindUrl);
                } catch (err) {
                    console.error('[Memoria] MindAR start failed:', err);
                    showCameraErrorScreen(err);
                }
            }

            // ================================================================
            // INIT — load MindAR first, then init scanner
            // ================================================================
            let _mindARLoaded = false;

            async function initScanner() {
                try {
                    // Load MindAR scripts dynamically
                    await loadMindAR();
                    _mindARLoaded = true;
                    console.log('[Memoria] MindAR ready, initializing scanner…');

                    // Check camera permission
                    let alreadyGranted = localStorage.getItem(PERM_KEY) === 'true';
                    if (navigator.permissions && navigator.permissions.query) {
                        try {
                            const status = await navigator.permissions.query({ name: 'camera' });
                            if (status.state === 'granted') alreadyGranted = true;
                            if (status.state === 'denied') alreadyGranted = false;
                            status.onchange = () => {
                                if (status.state === 'granted') localStorage.setItem(PERM_KEY, 'true');
                                if (status.state === 'denied') localStorage.removeItem(PERM_KEY);
                            };
                        } catch (_) {}
                    }

                    // Wire up the demo start button
                    document.getElementById('demoStartBtn').addEventListener('click', () => {
                        if (!_mindARLoaded) {
                            alert('MindAR is still loading… please wait.');
                            return;
                        }
                        startScanner();
                    });

                    if (alreadyGranted) {
                        document.getElementById('demo-overlay').classList.add('hidden');
                        // Small delay to ensure everything is ready
                        setTimeout(() => startScanner(), 300);
                    }
                } catch (err) {
                    console.error('[Memoria] Failed to load MindAR:', err);
                    document.getElementById('loading').innerHTML = `
                        <div style="text-align:center;padding:40px;max-width:360px">
                            <div style="font-size:32px;margin-bottom:16px">⚠️</div>
                            <h3 style="color:#fff;margin-bottom:8px">Failed to load AR engine</h3>
                            <p style="color:rgba(255,255,255,.55);font-size:13px;line-height:1.7">
                                Could not load the AR tracking library. Please check your internet connection and refresh the page.
                            </p>
                            <button onclick="location.reload()"
                                style="margin-top:22px;padding:12px 28px;border-radius:10px;background:var(--gold);color:#fff;border:none;cursor:pointer;font-size:14px">
                                Retry
                            </button>
                        </div>`;
                }
            }

            // ================================================================
            // EXPOSE TO WINDOW
            // ================================================================
            window.startScanner = startScanner;
            window.toggleTorch = toggleTorch;
            window.switchCamera = switchCamera;
            window.openFullscreen = openFullscreen;
            window.closeFullscreen = closeFullscreen;
            window.onFsTap = onFsTap;
            window.toggleFsPlay = toggleFsPlay;
            window.toggleFsMute = toggleFsMute;
            window.toggleFsMenu = toggleFsMenu;
            window.downloadCurrentVideo = downloadCurrentVideo;
            window.triggerOpenWithConfirm = triggerOpenWithConfirm;
            window.onLogoTap = onLogoTap;

            // ---- Boot ----
            initScanner();

            // ---- Tap diagnostic ----
            document.addEventListener('pointerdown', (e) => {
                const el = e.target;
                console.log('[Memoria][tap-diag] top element under tap:', el.tagName, el.className || '(no class)',
                    el.id || '(no id)');
            }, { capture: true });
        </script>
    </body>
    </html>
