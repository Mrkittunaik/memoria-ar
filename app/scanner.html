<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Scan — Memoria</title>

    <!-- Eruda debug console -->
    <script src="https://cdn.jsdelivr.net/npm/eruda">
    </script>
    <script>
        eruda.init();
    </script>

    <style>
        /* ============================================================
                   GLOBAL RESET & BASE
                ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --gold: #C9933A;
            --gold-light: rgba(201, 147, 58, .9);
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, 'DM Sans', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
                   AR CONTAINER — MindAR mounts its own video + canvases here
                ============================================================ */
        #ar-container {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2;
        }

        /* ============================================================
                   VIDEO OVERLAY LAYER — CSS3DObjects live here
                ============================================================ */
        #ar-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* ============================================================
                   AR VIDEO WRAPPER — per-detected-poster container
                ============================================================ */
        .ar-video-wrapper {
            pointer-events: all;
            overflow: hidden;
            border-radius: 2px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform-style: preserve-3d;
            will-change: transform;
            -webkit-transform: translateZ(0);
            perspective: 1000px;
            -webkit-perspective: 1000px;
        }

        /* ============================================================
                   AR VIDEO INNER — carries fade + visibility.
                ============================================================ */
        .ar-video-inner {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity .25s ease;
            pointer-events: none;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            -webkit-transform: translateZ(0);
            will-change: opacity;
            border-radius: 3px;
        }
        .ar-video-inner.visible {
            opacity: 1;
            animation: arFadeIn .35s ease both;
        }
        @keyframes arFadeIn {
            from {
                opacity: 0;
                transform: scale(.97);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ============================================================
                   AR VIDEO ELEMENT
                ============================================================ */
        .ar-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            -webkit-transform: translateZ(0);
            border-radius: 3px;
        }

        /* ============================================================
                   CORNER BRACKET OVERLAY
                ============================================================ */
        .ar-corners {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity .08s ease;
            will-change: opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            --stab: 1;
        }
        .ar-video-inner.tracking~.ar-corners,
        .ar-corners.tracking {
            opacity: 1;
        }

        .ar-edge {
            position: absolute;
            inset: 0;
            border-radius: 3px;
            pointer-events: none;
            border: 1.5px solid var(--gold);
            opacity: calc(var(--stab) * .5);
            filter: drop-shadow(0 0 calc(3px + var(--stab) * 7px) rgba(201, 147, 58, calc(var(--stab) * .8)));
            transition: opacity .15s linear, filter .15s linear;
        }

        .ar-corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border-color: var(--gold);
            border-style: solid;
            border-width: 0;
            filter: drop-shadow(0 0 calc(2px + var(--stab) * 4px) rgba(201, 147, 58, calc(.55 + var(--stab) * .45))) drop-shadow(0 0 calc(1px + var(--stab) * 1px) rgba(201, 147, 58, calc(.7 + var(--stab) * .3)));
            transition: filter .12s linear;
        }
        .ar-corner-tl {
            top: 0;
            left: 0;
            border-top-width: 4px;
            border-left-width: 4px;
            border-top-left-radius: 3px;
        }
        .ar-corner-tr {
            top: 0;
            right: 0;
            border-top-width: 4px;
            border-right-width: 4px;
            border-top-right-radius: 3px;
        }
        .ar-corner-bl {
            bottom: 0;
            left: 0;
            border-bottom-width: 4px;
            border-left-width: 4px;
            border-bottom-left-radius: 3px;
        }
        .ar-corner-br {
            bottom: 0;
            right: 0;
            border-bottom-width: 4px;
            border-right-width: 4px;
            border-bottom-right-radius: 3px;
        }

        @keyframes bracketLock {
            0% {
                width: 80px;
                height: 80px;
                opacity: .6;
            }
            60% {
                width: 54px;
                height: 54px;
                opacity: 1;
            }
            100% {
                width: 60px;
                height: 60px;
                opacity: 1;
            }
        }
        .ar-corners.lock-anim .ar-corner {
            animation: bracketLock .22s cubic-bezier(.22, .9, .32, 1) both;
        }

        @keyframes confirmPulse {
            0% {
                filter: brightness(1);
            }
            40% {
                filter: brightness(1.9);
            }
            100% {
                filter: brightness(1);
            }
        }
        .ar-corners.confirm-pulse,
        .ar-corners.confirm-pulse .ar-edge {
            animation: confirmPulse .18s ease-out both;
        }

        /* ============================================================
                   SCAN UI
                ============================================================ */
        #scan-ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 20px) 0 env(safe-area-inset-bottom, 20px);
            z-index: 5;
        }

        .scan-topbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            pointer-events: all;
        }
        .scan-logo {
            font-family: 'Georgia', serif;
            font-size: 18px;
            color: #fff;
            letter-spacing: -0.02em;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .5);
            cursor: pointer;
            user-select: none;
        }
        .scan-logo span {
            color: var(--gold);
        }
        .scan-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(255, 255, 255, .2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            transition: background .2s;
        }
        .scan-close:hover {
            background: rgba(0, 0, 0, .7);
        }

        .finder {
            flex: 1;
            width: 100%;
            pointer-events: none;
        }

        .status-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-bottom: 32px;
            pointer-events: all;
        }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, .55);
            backdrop-filter: blur(10px);
            border: 0.5px solid rgba(255, 255, 255, .15);
            border-radius: 10px;
            padding: 10px 18px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            transition: opacity .35s, transform .35s;
        }
        .status-pill .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #999;
            flex-shrink: 0;
        }
        .status-pill.ready .dot {
            background: var(--gold);
            animation: blink 1.5s ease-in-out infinite;
        }
        .status-pill.found .dot {
            background: #4CAF50;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: .3;
            }
        }
        .status-pill.found {
            background: rgba(30, 30, 30, .7);
            border-color: rgba(76, 175, 80, .4);
        }
        .status-pill.fade-out {
            opacity: 0;
            transform: translateY(6px);
        }

        .bottom-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .fab {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(255, 255, 255, .2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            transition: background .2s;
        }
        .fab:hover {
            background: rgba(0, 0, 0, .75);
        }

        /* ============================================================
                   LOADING SCREEN
                ============================================================ */
        #loading {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
            transition: opacity .5s;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .1);
            border-top-color: var(--gold);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loading p {
            font-size: 14px;
            color: rgba(255, 255, 255, .5);
        }
        #loading h3 {
            font-size: 17px;
            color: #fff;
            font-weight: 500;
        }
        #loading-counter {
            font-size: 13px;
            color: var(--gold);
            margin-top: 6px;
            min-height: 18px;
        }

        /* ============================================================
                   INSTANT PREVIEW
                ============================================================ */
        #instant-preview {
            position: fixed;
            top: 0;
            left: 0;
            object-fit: cover;
            background: #000;
            z-index: 1;
        }

        /* ============================================================
                   FULLSCREEN VIDEO PLAYER
                ============================================================ */
        #fullscreen-player {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: #000;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            --fs-origin-x: 50%;
            --fs-origin-y: 50%;
            --fs-origin-scale: 0.3;
            transform-origin: var(--fs-origin-x) var(--fs-origin-y);
            transform: scale(var(--fs-origin-scale));
            opacity: 0;
            transition: transform .38s cubic-bezier(.22, .9, .32, 1), opacity .28s ease;
            will-change: transform, opacity;
        }
        #fullscreen-player.open,
        #fullscreen-player.closing {
            display: flex;
        }
        #fullscreen-player.open {
            transform: scale(1);
            opacity: 1;
        }
        #fullscreen-player.closing {
            transform: scale(var(--fs-origin-scale));
            opacity: 0;
        }
        #fs-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #fs-tap-zone {
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        .fs-scrim-top,
        .fs-scrim-bottom {
            position: absolute;
            left: 0;
            right: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }
        .fs-scrim-top {
            top: 0;
            height: 140px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, .65), transparent);
        }
        .fs-scrim-bottom {
            bottom: 0;
            height: 180px;
            background: linear-gradient(to top, rgba(0, 0, 0, .75), transparent);
        }
        #fs-controls {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 1;
            transition: opacity .25s ease;
            pointer-events: none;
        }
        #fs-controls.hidden {
            opacity: 0;
        }
        #fs-controls.hidden .fs-hit {
            pointer-events: none;
        }
        #fs-controls:not(.hidden) .fs-hit {
            pointer-events: all;
        }
        .fs-top-row {
            position: absolute;
            top: env(safe-area-inset-top, 16px);
            left: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .fs-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(10px);
            border: 0.5px solid rgba(255, 255, 255, .18);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .15s;
        }
        .fs-icon-btn:hover {
            background: rgba(255, 255, 255, .22);
        }
        .fs-icon-btn:active {
            transform: scale(.92);
        }
        .fs-top-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }
        .fs-center-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .4);
            backdrop-filter: blur(6px);
            border: 0.5px solid rgba(255, 255, 255, .25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
        }
        .fs-center-play:active {
            transform: translate(-50%, -50%) scale(.92);
        }
        .fs-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0 18px env(safe-area-inset-bottom, 18px);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .fs-scrub-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .fs-time {
            font-size: 12px;
            color: rgba(255, 255, 255, .85);
            font-variant-numeric: tabular-nums;
            min-width: 38px;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
        }
        .fs-scrub-track {
            position: relative;
            flex: 1;
            height: 18px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
        }
        .fs-scrub-track::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, .25);
            border-radius: 2px;
        }
        .fs-scrub-fill {
            position: absolute;
            left: 0;
            height: 3px;
            border-radius: 2px;
            background: var(--gold);
            width: 0%;
            pointer-events: none;
        }
        .fs-scrub-buffer {
            position: absolute;
            left: 0;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, .4);
            width: 0%;
            pointer-events: none;
        }
        .fs-scrub-handle {
            position: absolute;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--gold);
            left: 0%;
            transform: translateX(-50%);
            box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
            pointer-events: none;
            transition: transform .1s;
        }
        .fs-scrub-track:active .fs-scrub-handle {
            transform: translateX(-50%) scale(1.25);
        }
        .fs-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 4px;
        }
        .fs-controls-left,
        .fs-controls-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .fs-ctrl-btn {
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 4px;
        }
        .fs-ctrl-btn:active {
            transform: scale(.9);
        }
        .fs-menu {
            position: absolute;
            top: 48px;
            right: 0;
            background: rgba(28, 26, 24, .96);
            backdrop-filter: blur(14px);
            border: 0.5px solid rgba(255, 255, 255, .14);
            border-radius: 14px;
            min-width: 180px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .5);
            overflow: hidden;
            display: none;
            pointer-events: all;
        }
        .fs-menu.open {
            display: block;
            animation: fsMenuIn .15s ease both;
        }
        @keyframes fsMenuIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fs-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s;
            white-space: nowrap;
        }
        .fs-menu-item:hover {
            background: rgba(255, 255, 255, .08);
        }
        .fs-menu-item svg {
            flex-shrink: 0;
            color: var(--gold);
        }
        #fs-toast {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: rgba(20, 18, 16, .92);
            backdrop-filter: blur(10px);
            border: 0.5px solid rgba(255, 255, 255, .14);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 5;
            white-space: nowrap;
        }
        #fs-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================================
                   DEMO OVERLAY
                ============================================================ */
        #demo-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            backdrop-filter: blur(4px);
            z-index: 90;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px;
            text-align: center;
        }
        #demo-overlay.hidden {
            display: none;
        }
        .demo-card {
            background: rgba(30, 28, 26, .9);
            border: 0.5px solid rgba(255, 255, 255, .12);
            border-radius: 20px;
            padding: 32px;
            max-width: 340px;
            width: 100%;
        }
        .demo-card h2 {
            font-size: 20px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 8px;
        }
        .demo-card p {
            font-size: 14px;
            color: rgba(255, 255, 255, .5);
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .demo-steps {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .demo-step {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .step-num-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(201, 147, 58, .2);
            border: 0.5px solid rgba(201, 147, 58, .4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
            color: var(--gold);
            flex-shrink: 0;
            margin-top: 1px;
        }
        .demo-step p {
            font-size: 13px;
            color: rgba(255, 255, 255, .6);
            line-height: 1.5;
            margin: 0;
        }
        .btn-demo-start {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: var(--gold);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: opacity .2s;
        }
        .btn-demo-start:hover {
            opacity: .88;
        }
        .btn-demo-close {
            background: transparent;
            border: 0.5px solid rgba(255, 255, 255, .2);
            color: rgba(255, 255, 255, .5);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        /* ============================================================
                   DEBUG HUD
                ============================================================ */
        #debug-hud {
            position: fixed;
            top: 54px;
            left: 10px;
            z-index: 50;
            background: rgba(0, 0, 0, .78);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(255, 255, 255, .12);
            border-radius: 10px;
            padding: 10px 12px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 10px;
            line-height: 1.6;
            color: #b8f0b8;
            pointer-events: none;
            display: none;
            min-width: 210px;
            max-width: 260px;
            white-space: pre;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .6);
        }
        #debug-hud.on {
            display: block;
        }
        #debug-hud .hud-section {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 0.5px solid rgba(255, 255, 255, .08);
        }
        #debug-hud .hud-section:first-child {
            border-top: none;
            margin-top: 0;
            padding-top: 0;
        }
        #debug-hud .hud-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: #ddd;
        }
        #debug-hud .hud-label {
            color: #888;
        }
        #debug-hud .hud-good {
            color: #4CAF50;
        }
        #debug-hud .hud-warn {
            color: #e8c34a;
        }
        #debug-hud .hud-bad {
            color: #e85a5a;
        }
        #debug-hud .hud-target {
            margin-top: 3px;
            padding-top: 3px;
            border-top: 0.5px solid rgba(255, 255, 255, .08);
        }
        #debug-hud .hud-target:first-child {
            border-top: none;
            margin-top: 0;
            padding-top: 0;
        }
        #debug-hud .hud-sub {
            padding-left: 8px;
            font-size: 9.5px;
            color: #aaa;
        }

        /* ============================================================
                   IMPORT MAPS + SCRIPTS
                ============================================================ */
        <script type="importmap">
            {
                "imports": {

        <script type="module">
            // ================================================================
            // DYNAMIC SCRIPT LOADER — ensures MindAR is 100% ready before we start
            // ================================================================
            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.crossOrigin = 'anonymous';
                    script.onload = () => resolve();
                    script.onerror = () => reject(new Error(`Failed to load: ${src}`));
                    document.head.appendChild(script);
                });
            }

            async function loadMindAR() {
                await loadScript('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
                await loadScript('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js');

                if (!window.MINDAR || !window.MINDAR.IMAGE || !window.MINDAR.IMAGE.Compiler || !window.MINDAR.IMAGE
                    .MindARThree) {

                }
                console.log('[Memoria] MindAR loaded successfully');
            }

            // ================================================================
            // IMPORTS
            // ================================================================
            import * as THREE from 'three';
            import { CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

            // ================================================================
            // CONSTANTS
            // ================================================================
            const BACKEND_URL = 'https://memoria-ar-backend.onrender.com';
            const PLANE_PX = 1000;
            const SCALE = 1000 / PLANE_PX;

            // Pose history length
            const POSE_HISTORY_LEN = 15;

            // Lost-target recovery
            const LOST_HOLD_MAX_MS = 5000;
            const LOST_FADE_START_MS = 300;
            const LOST_FADE_DURATION_MS = 1000;

            // Kalman tuning
            const KALMAN_Q_POS = 0.003;
            const KALMAN_R_POS = 0.04;
            const KALMAN_Q_ROT = 0.002;
            const KALMAN_R_ROT = 0.03;
            const KALMAN_Q_SCALE = 0.001;
            const KALMAN_R_SCALE = 0.02;

            // Confidence thresholds
            const CONF_HIGH = 0.85;
            const CONF_MID = 0.50;

            // ================================================================
            // STATE
            // ================================================================
            let torchOn = false;
            let mindarThree = null;
            let videoTrack = null;
            const arTargets = new Map();

            const PERM_KEY = 'memoria_camera_granted';
            let _backendReady = false;
            let _targets = [];
            let _lastMindUrl = null;
            let _cameraStoppedForVisibility = false;
            let _wakeLock = null;
            let _unmuteArmed = false;
            let _logoTapCount = 0,
                _logoTapTimer = null;
            let _lastFrameTime = performance.now();
            let _frameCount = 0,
                _fpsAccum = 0,
                _fps = 0,
                _lastFpsUpdate = performance.now();

            // Gyroscope state
            let _orientAvailable = false;
            let _lastOrient = null;
            const _orientEuler = new THREE.Euler();
            const _orientQuat = new THREE.Quaternion();
            const _prevOrientQuat = new THREE.Quaternion();
            const _orientDeltaQuat = new THREE.Quaternion();
            const _identityQuat = new THREE.Quaternion();

            // Fullscreen state
            const fsVideo = document.getElementById('fs-video');
            let fsControlsTimer = null;
            let fsScrubbing = false;
            let fsOpenTargetId = null;

            // ================================================================
            // KALMAN FILTER — 1D scalar with adaptive Q/R based on confidence
            // ================================================================
            class Kalman1D {
                constructor(q = 0.01, r = 0.1, init = 0) {
                    this.q = q;
                    this.r = r;
                    this.x = init;
                    this.p = 1.0;
                    this.k = 0;
                }

                update(z, confidence = 1.0) {
                    const adjR = this.r / (0.3 + 0.7 * confidence);
                    const adjQ = this.q * (0.5 + 0.5 * (1 - confidence));
                    const p_pred = this.p + adjQ;
                    this.k = p_pred / (p_pred + adjR);
                    this.x = this.x + this.k * (z - this.x);
                    this.p = (1 - this.k) * p_pred;
                    return this.x;
                }

                reset(z) {
                    this.x = z;
                    this.p = 1.0;
                    this.k = 0;
                }
            }

            // ================================================================
            // 3D KALMAN FILTER
            // ================================================================
            class KalmanPose {
                constructor(qPos = KALMAN_Q_POS, rPos = KALMAN_R_POS,
                    qRot = KALMAN_Q_ROT, rRot = KALMAN_R_ROT,
                    qScale = KALMAN_Q_SCALE, rScale = KALMAN_R_SCALE) {
                    this.kx = new Kalman1D(qPos, rPos, 0);
                    this.ky = new Kalman1D(qPos, rPos, 0);
                    this.kz = new Kalman1D(qPos, rPos, 0);
                    this.kqw = new Kalman1D(qRot, rRot, 1);
                    this.kqx = new Kalman1D(qRot, rRot, 0);
                    this.kqy = new Kalman1D(qRot, rRot, 0);
                    this.kqz = new Kalman1D(qRot, rRot, 0);
                    this.ksx = new Kalman1D(qScale, rScale, 1);
                    this.ksy = new Kalman1D(qScale, rScale, 1);
                    this.ksz = new Kalman1D(qScale, rScale, 1);
                    this._hasInit = false;
                }

                init(pos, quat, scale) {
                    this.kx.reset(pos.x);
                    this.ky.reset(pos.y);
                    this.kz.reset(pos.z);
                    this.kqw.reset(quat.w);
                    this.kqx.reset(quat.x);
                    this.kqy.reset(quat.y);
                    this.kqz.reset(quat.z);
                    this.ksx.reset(scale.x);
                    this.ksy.reset(scale.y);
                    this.ksz.reset(scale.z);
                    this._hasInit = true;
                }

                update(pos, quat, scale, confidence = 1.0) {
                    if (!this._hasInit) {
                        this.init(pos, quat, scale);
                        return { pos: pos.clone(), quat: quat.clone(), scale: scale.clone() };
                    }
                    const dot = quat.w * this.kqw.x + quat.x * this.kqx.x +
                        quat.y * this.kqy.x + quat.z * this.kqz.x;
                    const qIn = dot < 0 ? quat.clone().negate() : quat;

                    const outPos = new THREE.Vector3(
                        this.kx.update(pos.x, confidence),
                        this.ky.update(pos.y, confidence),
                        this.kz.update(pos.z, confidence)
                    );
                    const outQuat = new THREE.Quaternion(
                        this.kqx.update(qIn.x, confidence),
                        this.kqy.update(qIn.y, confidence),
                        this.kqz.update(qIn.z, confidence),
                        this.kqw.update(qIn.w, confidence)
                    ).normalize();
                    const outScale = new THREE.Vector3(
                        this.ksx.update(scale.x, confidence),
                        this.ksy.update(scale.y, confidence),
                        this.ksz.update(scale.z, confidence)
                    );
                    return { pos: outPos, quat: outQuat, scale: outScale };
                }

                reset(pos, quat, scale) {
                    this.kx.reset(pos.x);
                    this.ky.reset(pos.y);
                    this.kz.reset(pos.z);
                    this.kqw.reset(quat.w);
                    this.kqx.reset(quat.x);
                    this.kqy.reset(quat.y);
                    this.kqz.reset(quat.z);
                    this.ksx.reset(scale.x);
                    this.ksy.reset(scale.y);
                    this.ksz.reset(scale.z);
                    this._hasInit = true;
                }
            }

            // ================================================================
            // POSE HISTORY
            // ================================================================
            class PoseHistory {
                constructor(maxLen = POSE_HISTORY_LEN) {
                    this.maxLen = maxLen;
                    this.positions = [];
                    this.quaternions = [];
                    this.scales = [];
                    this.timestamps = [];
                }

                push(pos, quat, scale, ts) {
                    this.positions.push(pos.clone());
                    this.quaternions.push(quat.clone());
                    this.scales.push(scale.clone());
                    this.timestamps.push(ts);
                    if (this.positions.length > this.maxLen) {
                        this.positions.shift();
                        this.quaternions.shift();
                        this.scales.shift();
                        this.timestamps.shift();
                    }
                }

                getWeightedAverage() {
                    if (this.positions.length === 0) return null;
                    const n = this.positions.length;
                    const weights = [];
                    let totalW = 0;
                    for (let i = 0; i < n; i++) {
                        const w = Math.exp(i / n * 2.5);
                        weights.push(w);
                        totalW += w;
                    }
                    const avgPos = new THREE.Vector3();
                    const avgQuat = new THREE.Quaternion();
                    const avgScale = new THREE.Vector3();
                    const qAccum = new THREE.Quaternion();
                    for (let i = 0; i < n; i++) {
                        const w = weights[i] / totalW;
                        avgPos.x += this.positions[i].x * w;
                        avgPos.y += this.positions[i].y * w;
                        avgPos.z += this.positions[i].z * w;
                        qAccum.x += this.quaternions[i].x * w;
                        qAccum.y += this.quaternions[i].y * w;
                        qAccum.z += this.quaternions[i].z * w;
                        qAccum.w += this.quaternions[i].w * w;
                        avgScale.x += this.scales[i].x * w;
                        avgScale.y += this.scales[i].y * w;
                        avgScale.z += this.scales[i].z * w;
                    }
                    avgQuat.copy(qAccum).normalize();
                    return { pos: avgPos, quat: avgQuat, scale: avgScale };
                }

                getVelocity(dt) {
                    if (this.positions.length < 2) return null;
                    const n = this.positions.length;
                    const idx = Math.max(0, n - 3);
                    const p1 = this.positions[idx];
                    const p2 = this.positions[this.positions.length - 1];
                    const t1 = this.timestamps[idx];
                    const t2 = this.timestamps[this.timestamps.length - 1];
                    const dtActual = (t2 - t1) / 1000;
                    if (dtActual < 0.001) return null;
                    const vel = p2.clone().sub(p1).divideScalar(dtActual);
                    return { pos: vel };
                }

                clear() {
                    this.positions = [];
                    this.quaternions = [];
                    this.scales = [];
                    this.timestamps = [];
                }
            }

            // ================================================================
            // CONFIDENCE SCORING
            // ================================================================
            function computeConfidence(entry) {
                let score = 0.5;
                let factors = 0;

                if (entry.userVel !== undefined) {
                    const velScore = Math.max(0, 1 - entry.userVel / 0.8);
                    score += velScore * 0.35;
                    factors += 0.35;
                }

                if (entry.stability !== undefined) {
                    score += entry.stability * 0.30;
                    factors += 0.30;
                }

                if (entry._consecutiveFrames !== undefined) {
                    const cf = Math.min(entry._consecutiveFrames, 60);
                    const cfScore = cf / 60;
                    score += cfScore * 0.20;
                    factors += 0.20;
                }

                if (entry.anchor && entry.anchor.visible) {
                    score += 0.15;
                    factors += 0.15;
                }

                if (factors > 0) score = score / factors;
                return Math.max(0, Math.min(1, score));
            }

            // ================================================================
            // ANCHOR LOCK SYSTEM
            // ================================================================
            class AnchorLock {
                constructor() {
                    this.locked = false;
                    this.lockPos = new THREE.Vector3();
                    this.lockQuat = new THREE.Quaternion();
                    this.lockScale = new THREE.Vector3(1, 1, 1);
                    this.lockStartTime = 0;
                    this.stableFrames = 0;
                    this.requiredStableFrames = 30;
                    this.isStable = false;
                }

                update(pos, quat, scale, confidence, dt) {
                    if (confidence < CONF_HIGH) {
                        this.stableFrames = 0;
                        this.isStable = false;
                        this.locked = false;
                        return false;
                    }

                    this.stableFrames++;
                    if (this.stableFrames >= this.requiredStableFrames) {
                        this.isStable = true;
                        if (!this.locked) {
                            this.lockPos.copy(pos);
                            this.lockQuat.copy(quat);
                            this.lockScale.copy(scale);
                            this.lockStartTime = performance.now();
                            this.locked = true;
                            return true;
                        }
                    }
                    return false;
                }

                apply(pos, quat, scale, threshold = 0.02) {
                    if (!this.locked) {
                        pos.copy(pos);
                        quat.copy(quat);
                        scale.copy(scale);
                        return false;
                    }

                    const dPos = pos.distanceTo(this.lockPos);
                    const dRot = quat.angleTo(this.lockQuat);
                    const dScale = scale.distanceTo(this.lockScale);

                    if (dPos > threshold * 3 || dRot > 0.08 || dScale > threshold * 2) {
                        this.locked = false;
                        this.isStable = false;
                        this.stableFrames = 0;
                        pos.copy(pos);
                        quat.copy(quat);
                        scale.copy(scale);
                        return false;
                    }

                    pos.copy(this.lockPos);
                    quat.copy(this.lockQuat);
                    scale.copy(this.lockScale);
                    return true;
                }

                reset() {
                    this.locked = false;
                    this.isStable = false;
                    this.stableFrames = 0;
                }
            }

            // ================================================================
            // UTILITY FUNCTIONS
            // ================================================================
            function loadImage(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = url;
                });
            }

            function getSessionId() {
                let sid = localStorage.getItem('memoria_session');
                if (!sid) {
                    sid = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
                    localStorage.setItem('memoria_session', sid);
                }
                return sid;
            }

            function fmtTime(t) {
                if (!isFinite(t) || t < 0) t = 0;
                const m = Math.floor(t / 60),
                    s = Math.floor(t % 60);
                return m + ':' + String(s).padStart(2, '0');
            }

            function scoreClass(v) {
                return v > 0.75 ? 'hud-good' : v > 0.45 ? 'hud-warn' : 'hud-bad';
            }

            function setLoadingState(title, sub, counter) {
                document.getElementById('loading-title').textContent = title;
                document.getElementById('loading-sub').textContent = sub;
                document.getElementById('loading-counter').textContent = counter || '';
            }

            // ================================================================
            // BACKEND WAKE — RELIABLE with exponential backoff and clear feedback
            // ================================================================
            async function wakeBackend() {
                if (_backendReady) return;
                const statusText = document.getElementById('statusText');
                const pill = document.getElementById('statusPill');

                // First, try a quick health check with a short timeout
                try {
                    const res = await fetch(`${BACKEND_URL}/health`, {
                        signal: AbortSignal.timeout(3000)
                    });
                    if (res.ok) {
                        _backendReady = true;
                        console.log('[Memoria] Backend is awake');
                        return;
                    }
                } catch (_) {
                    // Health check failed — backend is likely sleeping
                    console.log('[Memoria] Backend health check failed, waking up…');
                }

                // Backend is sleeping — show wake-up progress
                if (statusText) {
                    statusText.textContent = '🔄 Waking up server… (Render cold start, 30–60s)';
                    pill.className = 'status-pill ready';
                }

                // Try fetching targets directly — this will wake the backend
                let attempts = 0;
                const maxAttempts = 8;
                const baseDelay = 2000;

                while (attempts < maxAttempts) {
                    attempts++;
                    const delay = baseDelay * Math.min(2, attempts);
                    const elapsed = (attempts * baseDelay) / 1000;

                    if (statusText) {
                        statusText.textContent = `🔄 Waking up server… ${Math.round(elapsed)}s elapsed`;
                    }

                    try {
                        const res = await fetch(`${BACKEND_URL}/api/memories/targets`, {
                            signal: AbortSignal.timeout(8000)
                        });
                        if (res.ok) {
                            _backendReady = true;
                            console.log('[Memoria] Backend woke up successfully');
                            if (statusText) statusText.textContent = '✅ Server ready!';
                            return;
                        }
                        // If we get a response but not OK, something else is wrong
                        console.warn('[Memoria] Backend responded with status:', res.status);
                    } catch (err) {
                        // Request failed — backend still sleeping, continue retry
                        console.log(`[Memoria] Wake attempt ${attempts}/${maxAttempts} failed, retrying…`);
                    }

                    // Wait before next attempt
                    if (attempts < maxAttempts) {
                        await new Promise(r => setTimeout(r, delay));
                    }
                }

                // If we get here, all attempts failed
                throw new Error(
                    'Backend did not respond after multiple attempts. It may be down or unreachable. Please try again later.');
            }

            // ================================================================
            // FETCH & COMPILE TARGETS — with retry and clear error handling
            // ================================================================
            async function fetchAndCompileTargets() {
                const statusText = document.getElementById('statusText');
                const pill = document.getElementById('statusPill');
                pill.className = 'status-pill ready';
                statusText.textContent = '📡 Fetching memories…';

                let res;
                let fetchAttempts = 0;
                const maxFetchAttempts = 3;

                while (fetchAttempts < maxFetchAttempts) {
                    fetchAttempts++;
                    try {
                        res = await fetch(`${BACKEND_URL}/api/memories/targets`, {
                            signal: AbortSignal.timeout(10000)
                        });
                        if (res.ok) break;
                    } catch (err) {
                        console.warn(`[Memoria] Fetch attempt ${fetchAttempts}/${maxFetchAttempts} failed:`, err);
                        if (fetchAttempts < maxFetchAttempts) {
                            await new Promise(r => setTimeout(r, 1500));
                        } else {
                            throw new Error(
                                `Failed to fetch memories after ${maxFetchAttempts} attempts. Please check your connection.`);
                        }
                    }
                }

                if (!res || !res.ok) {
                    throw new Error(`Backend error: ${res ? res.status : 'no response'}`);
                }

                const data = await res.json();

                if (!data.success || !data.data.targets || data.data.targets.length === 0) {
                    statusText.textContent = '📭 No memories uploaded yet. Add one in the dashboard.';
                    return null;
                }

                _targets = data.data.targets;

                statusText.textContent = `🔄 Preparing AR tracking for ${_targets.length} photo${_targets.length > 1 ? 's' : ''}…`;

                const { Compiler } = window.MINDAR.IMAGE;
                const compiler = new Compiler();
                const images = await Promise.all(_targets.map(t => loadImage(t.photoUrl)));
                await compiler.compileImageTargets(images, (progress) => {
                    statusText.textContent = `🔄 Preparing AR tracking… ${Math.round(progress)}%`;
                });
                const mindBuffer = compiler.exportData();
                const mindBlob = new Blob([mindBuffer]);

                _targets.forEach(t => {
                    const v = document.createElement('video');
                    v.src = t.videoUrl;
                    v.preload = 'auto';
                    v.muted = true;
                    v.playsInline = true;
                    v.load();
                });

                _lastMindUrl = URL.createObjectURL(mindBlob);
                statusText.textContent = `✅ Ready! Scanning for ${_targets.length} photo${_targets.length > 1 ? 's' : ''}…`;
                return _lastMindUrl;
            }

            // ================================================================
            // TEARDOWN MINDAR
            // ================================================================
            function teardownMindAR() {
                if (!mindarThree) return;
                if (_wakeLock) { try { _wakeLock.release(); } catch (_) {} _wakeLock = null; }
                try { if (mindarThree.controller) mindarThree.controller.dispose(); } catch (_) {}
                try {
                    if (mindarThree.video && mindarThree.video.srcObject) {
                        mindarThree.video.srcObject.getTracks().forEach(t => t.stop());
                    }
                    if (mindarThree.video) mindarThree.video.remove();
                } catch (_) {}
                try {
                    mindarThree.renderer.setAnimationLoop(null);
                    mindarThree.renderer.dispose();
                    mindarThree.renderer.forceContextLoss();
                    if (mindarThree.renderer.domElement) mindarThree.renderer.domElement.remove();
                } catch (_) {}
                try {
                    if (mindarThree.cssRenderer.domElement) mindarThree.cssRenderer.domElement.remove();
                } catch (_) {}
                mindarThree = null;
                videoTrack = null;
            }

            // ================================================================
            // WAKE LOCK
            // ================================================================
            async function acquireWakeLock() {
                if (!('wakeLock' in navigator)) return;
                try {
                    _wakeLock = await navigator.wakeLock.request('screen');
                    _wakeLock.addEventListener('release', () => { _wakeLock = null; });
                } catch (_) {}
            }

            async function reacquireWakeLockIfNeeded() {
                if (!document.hidden && !_wakeLock && mindarThree) {
                    await acquireWakeLock();
                }
            }
            document.addEventListener('visibilitychange', reacquireWakeLockIfNeeded);

            // ================================================================
            // VISIBILITY CHANGE
            // ================================================================
            async function handleVisibilityChange() {
                if (!mindarThree) return;
                if (fsOpenTargetId !== null) return;

                if (document.hidden) {
                    if (_cameraStoppedForVisibility) return;
                    _cameraStoppedForVisibility = true;
                    teardownMindAR();
                } else {
                    if (!_cameraStoppedForVisibility) return;
                    _cameraStoppedForVisibility = false;
                    try {
                        arTargets.forEach(entry => { try { entry.wrapper.remove(); } catch (_) {} });
                        arTargets.clear();
                        await beginMindAR(_lastMindUrl);
                        refreshStatusPill();
                    } catch (err) {
                        console.error('[Memoria] camera restart on return failed:', err);
                        showCameraErrorScreen(err);
                    }
                }
            }
            document.addEventListener('visibilitychange', handleVisibilityChange);

            // ================================================================
            // BEGIN MINDAR
            // ================================================================
            async function beginMindAR(mindUrl) {
                const statusText = document.getElementById('statusText');

                mindarThree = new window.MINDAR.IMAGE.MindARThree({
                    container: document.getElementById('ar-container'),
                    imageTargetSrc: mindUrl,
                    maxTrack: Math.min(_targets.length, 4),
                    filterMinCF: 0.00015,
                    filterBeta: 180,
                    uiLoading: 'no',
                    uiScanning: 'no',
                    uiError: 'no',
                });

                await mindarThree.start();

                try {
                    videoTrack = mindarThree.video.srcObject.getVideoTracks()[0];
                } catch (_) {}

                acquireWakeLock();

                statusText.textContent = `🔍 Scanning for ${_targets.length} photo${_targets.length > 1 ? 's' : ''}…`;

                _targets.forEach((target, index) => {
                    const anchor = mindarThree.addCSSAnchor(index);
                    spawnArTarget(String(target.id), index, target, anchor);

                    anchor.onTargetFound = () => onTargetFound(String(target.id));
                    anchor.onTargetLost = () => onTargetLost(String(target.id));
                });

                // ---- Gyroscope ----
                function onDeviceOrientation(e) {
                    if (e.alpha == null) return;
                    _orientAvailable = true;
                    _lastOrient = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
                }
                window.addEventListener('deviceorientation', onDeviceOrientation, true);

                function currentOrientQuat(out) {
                    if (!_lastOrient) return null;
                    _orientEuler.set(
                        THREE.MathUtils.degToRad(_lastOrient.beta || 0),
                        THREE.MathUtils.degToRad(_lastOrient.alpha || 0),
                        -THREE.MathUtils.degToRad(_lastOrient.gamma || 0),
                        'YXZ'
                    );
                    return out.setFromEuler(_orientEuler);
                }

                // ---- Main render loop ----
                const _rawPos = new THREE.Vector3();
                const _rawQuat = new THREE.Quaternion();
                const _rawScale = new THREE.Vector3();
                const _leadPos = new THREE.Vector3();

                mindarThree.renderer.setAnimationLoop(() => {
                    const now = performance.now();
                    const dt = Math.max(0, now - _lastFrameTime);
                    _lastFrameTime = now;
                    const dtSec = dt / 1000;

                    _frameCount++;
                    _fpsAccum += dt;
                    if (now - _lastFpsUpdate > 500) {
                        _fps = Math.round((_frameCount * 1000) / _fpsAccum);
                        _frameCount = 0;
                        _fpsAccum = 0;
                        _lastFpsUpdate = now;
                    }

                    const curOrientQuat = _orientAvailable ? currentOrientQuat(_orientQuat) : null;

                    arTargets.forEach((entry) => {
                        const { anchor, smoothed, inner, kalman, history, anchorLock } = entry;
                        const rawVisible = anchor.visible;
                        const wasVisible = smoothed.userData.wasVisible === true;

                        if (rawVisible) {
                            anchor.group.matrix.decompose(_rawPos, _rawQuat, _rawScale);

                            let accept = true;
                            if (entry._lastGoodRawPos && wasVisible) {
                                const posJump = entry._lastGoodRawPos.distanceTo(_rawPos);
                                const rotJump = entry._lastGoodRawQuat ? entry._lastGoodRawQuat.angleTo(
                                _rawQuat) : 0;
                                const posLimit = 1.2 * Math.max(dtSec, 1 / 120);
                                const rotLimit = 12 * Math.max(dtSec, 1 / 120);
                                if (posJump > posLimit || rotJump > rotLimit) {
                                    entry._rejectStreak = (entry._rejectStreak || 0) + 1;
                                    if (entry._rejectStreak <= 3) accept = false;
                                } else {
                                    entry._rejectStreak = 0;
                                }
                            }
                            entry._rejectedLastFrame = !accept;

                            if (!accept) {
                                entry._rejectCount = (entry._rejectCount || 0) + 1;
                                entry.cssObject.element.style.visibility = 'visible';
                                smoothed.userData.wasVisible = true;
                                entry._consecutiveFrames = (entry._consecutiveFrames || 0) + 1;
                                entry.corners.style.setProperty('--stab', String(Math.max(0, Math.min(1, entry
                                    .stability || 0.5))));
                                return;
                            }

                            entry._lastGoodRawPos = (entry._lastGoodRawPos || new THREE.Vector3()).copy(_rawPos);
                            entry._lastGoodRawQuat = (entry._lastGoodRawQuat || new THREE.Quaternion()).copy(
                            _rawQuat);
                            entry._lostSince = null;
                            entry._holdOrientQuat = null;

                            entry.cssObject.element.style.visibility = 'visible';
                            entry.inner.style.opacity = '';
                            smoothed.userData.wasVisible = true;
                            entry._consecutiveFrames = (entry._consecutiveFrames || 0) + 1;

                            const prevRaw = entry._prevRawPos || (entry._prevRawPos = _rawPos.clone());
                            const instVel = dtSec > 0 ? prevRaw.distanceTo(_rawPos) / dtSec : 0;
                            entry.userVel = entry.userVel === undefined ? instVel : entry.userVel * 0.65 +
                                instVel * 0.35;

                            if (dtSec > 0) {
                                const instVelVec = _rawPos.clone().sub(prevRaw).divideScalar(dtSec);
                                entry._velVec = entry._velVec ?
                                    entry._velVec.lerp(instVelVec, 0.2) :
                                    instVelVec;
                            }
                            entry._prevRawPos.copy(_rawPos);

                            entry.history.push(_rawPos, _rawQuat, _rawScale, now);

                            const confidence = computeConfidence(entry);
                            entry.confidence = confidence;

                            const kalmanResult = entry.kalman.update(_rawPos, _rawQuat, _rawScale, confidence);
                            const avgResult = entry.history.getWeightedAverage();

                            let fusedPos, fusedQuat, fusedScale;
                            if (avgResult && confidence > CONF_MID) {
                                const kWeight = 0.4 + 0.4 * confidence;
                                const hWeight = 1 - kWeight;
                                fusedPos = kalmanResult.pos.clone().lerp(avgResult.pos, hWeight);
                                fusedQuat = kalmanResult.quat.clone().slerp(avgResult.quat, hWeight);
                                fusedScale = kalmanResult.scale.clone().lerp(avgResult.scale, hWeight);
                            } else {
                                fusedPos = kalmanResult.pos.clone();
                                fusedQuat = kalmanResult.quat.clone();
                                fusedScale = kalmanResult.scale.clone();
                            }

                            if (curOrientQuat && entry._lastGoodRawQuat) {
                                const gyroWeight = 0.12 * (1 - confidence);
                                if (gyroWeight > 0.01) {
                                    const gyroCorrection = curOrientQuat.clone();
                                    fusedQuat.slerp(gyroCorrection, gyroWeight);
                                    fusedQuat.normalize();
                                }
                            }

                            const velData = entry.history.getVelocity(dtSec);
                            if (velData && entry.userVel > 0.02) {
                                const leadScale = Math.min(0.025, velData.pos.length() * 0.04);
                                _leadPos.copy(fusedPos).add(velData.pos.clone().multiplyScalar(leadScale));
                            } else {
                                _leadPos.copy(fusedPos);
                            }

                            entry.anchorLock.update(_leadPos, fusedQuat, fusedScale, confidence, dtSec);
                            const isLocked = entry.anchorLock.apply(_leadPos, fusedQuat, fusedScale, 0.025);

                            smoothed.position.copy(_leadPos);
                            smoothed.quaternion.copy(fusedQuat);
                            smoothed.scale.copy(fusedScale);

                            const jitterPenalty = Math.min(1, entry.userVel / 0.6);
                            const targetStab = 1 - jitterPenalty * 0.5;
                            entry.stability = entry.stability === undefined ? targetStab :
                                entry.stability * 0.88 + targetStab * 0.12;

                            const minScale = 0.3;
                            const maxScale = 3.0;
                            smoothed.scale.x = Math.max(minScale, Math.min(maxScale, smoothed.scale.x));
                            smoothed.scale.y = Math.max(minScale, Math.min(maxScale, smoothed.scale.y));
                            smoothed.scale.z = Math.max(minScale, Math.min(maxScale, smoothed.scale.z));

                            smoothed.updateMatrix();
                            entry.corners.style.setProperty('--stab', String(Math.max(0, Math.min(1, entry
                                .stability || 0.5))));
                            entry.isAnchorLocked = isLocked;
                            entry._lostSince = null;

                        } else {
                            if (wasVisible) {
                                entry._lostSince = now;
                                entry._holdOrientQuat = curOrientQuat ? curOrientQuat.clone() : null;
                                entry._lostPos = smoothed.position.clone();
                                entry._lostQuat = smoothed.quaternion.clone();
                                entry._lostScale = smoothed.scale.clone();
                            }

                            const lostSince = entry._lostSince;
                            if (lostSince == null) {
                                entry.cssObject.element.style.visibility = 'hidden';
                                smoothed.userData.wasVisible = false;
                                return;
                            }

                            const lostMs = now - lostSince;

                            if (lostMs > LOST_HOLD_MAX_MS) {
                                entry.cssObject.element.style.visibility = 'hidden';
                                smoothed.userData.wasVisible = false;
                                entry.history.clear();
                                entry.anchorLock.reset();
                                return;
                            }

                            entry.cssObject.element.style.visibility = 'visible';
                            smoothed.userData.wasVisible = true;

                            if (curOrientQuat && entry._holdOrientQuat && entry._lostQuat) {
                                _prevOrientQuat.copy(entry._holdOrientQuat).invert();
                                _orientDeltaQuat.copy(curOrientQuat).multiply(_prevOrientQuat);
                                const correctionAngle = _orientDeltaQuat.angleTo(_identityQuat);
                                const MAX_CORRECTION_RAD = THREE.MathUtils.degToRad(30);
                                if (correctionAngle > MAX_CORRECTION_RAD) {
                                    _orientDeltaQuat.slerp(_identityQuat, 1 - MAX_CORRECTION_RAD /
                                    correctionAngle);
                                }
                                const correctedQuat = entry._lostQuat.clone();
                                correctedQuat.multiply(_orientDeltaQuat);
                                smoothed.quaternion.copy(correctedQuat);
                            } else if (entry._lostQuat) {
                                smoothed.quaternion.copy(entry._lostQuat);
                            }
                            if (entry._lostPos) smoothed.position.copy(entry._lostPos);
                            if (entry._lostScale) smoothed.scale.copy(entry._lostScale);

                            const fadeT = lostMs <= LOST_FADE_START_MS ? 0 :
                                Math.min(1, (lostMs - LOST_FADE_START_MS) / LOST_FADE_DURATION_MS);
                            entry.inner.style.opacity = String(1 - fadeT * 0.82);
                            entry.stability = entry.stability === undefined ? 0.4 : entry.stability * 0.92;

                            entry.corners.style.setProperty('--stab', String(Math.max(0, Math.min(1, entry
                                .stability))));
                            smoothed.updateMatrix();
                        }
                    });

                    mindarThree.renderer.render(mindarThree.scene, mindarThree.camera);
                    mindarThree.cssRenderer.render(mindarThree.cssScene, mindarThree.camera);

                    if (window.__memoriaDebug) updateDebugHud(_fps, dt, curOrientQuat !== null);
                });
            }

            // ================================================================
            // SPAWN AR TARGET
            // ================================================================
            function spawnArTarget(id, targetIndex, target, anchor) {
                console.log('[Memoria] spawning target', id, {
                    photoWidth: target.photoWidth,
                    photoHeight: target.photoHeight,
                    videoRect: target.videoRect,
                    videoUrl: target.videoUrl,
                });

                const pw = target.photoWidth,
                    ph = target.photoHeight;
                const aspect = (typeof pw === 'number' && pw > 0 && typeof ph === 'number' && ph > 0) ?
                    ph / pw : 1;

                const wrapper = document.createElement('div');
                wrapper.className = 'ar-video-wrapper';
                wrapper.dataset.targetId = id;
                wrapper.style.width = PLANE_PX + 'px';
                wrapper.style.height = (PLANE_PX * aspect) + 'px';

                const inner = document.createElement('div');
                inner.className = 'ar-video-inner';

                const video = document.createElement('video');
                video.className = 'ar-video';
                video.loop = true;
                video.playsInline = true;
                video.muted = true;
                video.volume = 1;
                video.preload = 'auto';
                video.src = target.videoUrl;
                video.addEventListener('error', () => {
                    const mediaErr = video.error;
                    console.error('[Memoria] AR video failed to load', id, target.videoUrl, {
                        code: mediaErr && mediaErr.code,
                        message: mediaErr && mediaErr.message,
                    });
                });
                video.load();
                inner.appendChild(video);
                wrapper.appendChild(inner);

                const corners = document.createElement('div');
                corners.className = 'ar-corners';
                const edge = document.createElement('div');
                edge.className = 'ar-edge';
                corners.appendChild(edge);
                ['tl', 'tr', 'bl', 'br'].forEach(pos => {
                    const c = document.createElement('div');
                    c.className = `ar-corner ar-corner-${pos}`;
                    corners.appendChild(c);
                });
                wrapper.appendChild(corners);

                wrapper.addEventListener('click', () => {
                    entry_openGuard(id);
                });
                wrapper.addEventListener('pointerdown', (e) => {
                    entry_openGuard(id);
                });

                function entry_openGuard(targetId) {
                    const e = arTargets.get(targetId);
                    if (!e) return;
                    const now = performance.now();
                    if (e._lastOpenTriggerAt && now - e._lastOpenTriggerAt < 600) return;
                    e._lastOpenTriggerAt = now;
                    triggerOpenWithConfirm(targetId);
                }

                const rawRect = target.videoRect || {};
                const numOr = (v, fallback) => (typeof v === 'number' && isFinite(v)) ? v : fallback;
                const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
                const rectW = clamp(numOr(rawRect.width, 45), 1, 100);
                const rectH = clamp(numOr(rawRect.height, 80), 1, 100);
                const rectX = clamp(numOr(rawRect.x, 50), 0, 100);
                const rectY = clamp(numOr(rawRect.y, 50), 0, 100);
                const left = clamp(rectX - rectW / 2, 0, 100 - rectW);
                const top = clamp(rectY - rectH / 2, 0, 100 - rectH);
                video.style.position = 'absolute';
                video.style.left = left + '%';
                video.style.top = top + '%';
                video.style.width = rectW + '%';
                video.style.height = rectH + '%';

                const cssObject = new CSS3DObject(wrapper);
                cssObject.scale.set(SCALE, SCALE, SCALE);

                const smoothed = new THREE.Object3D();
                smoothed.add(cssObject);
                mindarThree.cssScene.add(smoothed);
                smoothed.matrixAutoUpdate = true;
                smoothed.position.setFromMatrixPosition(anchor.group.matrix);
                smoothed.quaternion.setFromRotationMatrix(anchor.group.matrix);
                smoothed.scale.setFromMatrixScale(anchor.group.matrix);

                const entry = {
                    wrapper,
                    inner,
                    corners,
                    video,
                    cssObject,
                    smoothed,
                    anchor,
                    lastSeen: 0,
                    visible: false,
                    kalman: new KalmanPose(),
                    history: new PoseHistory(POSE_HISTORY_LEN),
                    anchorLock: new AnchorLock(),
                    userVel: 0,
                    _velVec: null,
                    _prevRawPos: null,
                    confidence: 0.5,
                    stability: 0.5,
                    _lostSince: null,
                    _holdOrientQuat: null,
                    _lostPos: null,
                    _lostQuat: null,
                    _lostScale: null,
                    _lostTeardownTimer: null,
                    _rejectStreak: 0,
                    _rejectCount: 0,
                    _rejectedLastFrame: false,
                    _consecutiveFrames: 0,
                    _lastGoodRawPos: null,
                    _lastGoodRawQuat: null,
                    isAnchorLocked: false,
                    _lastOpenTriggerAt: 0,
                };

                arTargets.set(id, entry);
            }

            // ================================================================
            // ON TARGET FOUND
            // ================================================================
            function onTargetFound(id) {
                const entry = arTargets.get(id);
                if (!entry) return;
                entry.visible = true;
                entry.lastSeen = performance.now();
                entry.inner.classList.add('visible', 'tracking');
                entry.inner.style.opacity = '';
                clearTimeout(entry._lostTeardownTimer);

                const wasTracking = entry.corners.classList.contains('tracking');
                entry.corners.classList.add('tracking');
                if (!wasTracking) {
                    entry.corners.classList.remove('lock-anim');
                    void entry.corners.offsetWidth;
                    entry.corners.classList.add('lock-anim');
                    setTimeout(() => entry.corners.classList.remove('lock-anim'), 300);
                }

                const tryPlay = () => {
                    entry.video.muted = false;
                    entry.video.play().catch((err) => {
                        console.warn('[Memoria] unmuted play() blocked, falling back to muted-then-retry', id,
                            err && err.name);
                        entry.video.muted = true;
                        entry.video.play().catch((err2) => {
                            console.error('[Memoria] video.play() rejected even muted', id, err2 && err2
                                .name, err2 && err2.message);
                        });
                        armUnmuteOnNextTap();
                    });
                };
                if (entry.video.readyState >= 2) {
                    tryPlay();
                } else {
                    entry.video.addEventListener('canplay', tryPlay, { once: true });
                    setTimeout(() => entry.video.removeEventListener('canplay', tryPlay), 8000);
                }

                logScan(id);
                refreshStatusPill();
            }

            // ================================================================
            // ON TARGET LOST
            // ================================================================
            function onTargetLost(id) {
                const entry = arTargets.get(id);
                if (!entry) return;
                entry.visible = false;
                entry.corners.classList.remove('tracking', 'lock-anim');

                entry.inner.classList.remove('tracking');
                entry.inner.classList.add('losing');
                clearTimeout(entry._lostTeardownTimer);
                entry._lostTeardownTimer = setTimeout(() => {
                    if (!entry.visible) {
                        entry.inner.classList.remove('visible', 'losing');
                        entry.inner.style.opacity = '';
                        entry.video.pause();
                    }
                }, LOST_HOLD_MAX_MS + 200);
                refreshStatusPill();
            }

            // ================================================================
            // UNMUTE ON TAP
            // ================================================================
            function armUnmuteOnNextTap() {
                if (_unmuteArmed) return;
                _unmuteArmed = true;
                const unmuteAll = () => {
                    let stillMuted = false;
                    arTargets.forEach(entry => {
                        if (entry.video.muted) {
                            entry.video.muted = false;
                            entry.video.play().catch(() => { entry.video.muted = true;
                                stillMuted = true; });
                        }
                    });
                    if (!stillMuted) {
                        _unmuteArmed = false;
                        document.removeEventListener('pointerdown', unmuteAll);
                    }
                };
                document.addEventListener('pointerdown', unmuteAll);
            }

            // ================================================================
            // STATUS PILL
